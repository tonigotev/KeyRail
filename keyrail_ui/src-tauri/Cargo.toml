[package]
name = "keyrail_ui"
version = "0.1.0"
description = "Settings UI for KeyRail"
authors = ["KeyRail"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

# Updates are checked against the GitHub release feed and verified with the
# minisign public key in tauri.conf.json. tauri-plugin-process supplies the
# relaunch that has to follow a successful install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
